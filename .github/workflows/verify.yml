name: Verify JSP-000726
on:
  push:
    branches: [verify-jsp-000726]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - name: Check out the submitted proof
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: efeb2bbcef57ae089828784bdc5700d366cc72f5
          persist-credentials: false
      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'true'
      - name: Build project and audit both original theorems
        run: |
          git rev-parse HEAD
          lean --version
          lake --wfail build
          lake env python upstream/replay.py
          git diff --exit-code
